plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.aryan.wearmodesync'
    compileSdk 36

    defaultConfig {
        applicationId "com.aryan.wearmodesync"
        minSdk 34
        targetSdk 34
        versionCode 5
        versionName "3.0"

    }

    signingConfigs {
        release {
            if (localProperties.getProperty('KEYSTORE_PATH') != null) {
                storeFile file(localProperties.getProperty('KEYSTORE_PATH'))
                storePassword localProperties.getProperty('KEYSTORE_PASSWORD')
                keyAlias localProperties.getProperty('KEY_ALIAS')
                keyPassword localProperties.getProperty('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig localProperties.getProperty('KEYSTORE_PATH') != null ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation project(path: ':common')
}